
name: CI - Build, Scan, Push



on:

  push:

    branches: [main]

  pull_request:

    branches: [main]



permissions:

  contents: read

  packages: write

  security-events: write



jobs:

  build-scan-push:

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix:

        service: [api, worker, frontend]



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set lowercase repo owner

        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"



      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3



      - name: Build production image (local only)

        uses: docker/build-push-action@v6

        with:

          context: ./${{ matrix.service }}

          file: ./${{ matrix.service }}/Containerfile

          target: production

          tags: ghcr.io/${{ env.OWNER_LC }}/devops-project-app-${{ matrix.service }}:latest

          load: true

          push: false



      - name: Trivy scan (quality gate)

        uses: aquasecurity/trivy-action@0.36.0

        with:

          image-ref: ghcr.io/${{ env.OWNER_LC }}/devops-project-app-${{ matrix.service }}:latest

          format: sarif

          output: trivy-${{ matrix.service }}.sarif

          severity: CRITICAL,HIGH

          exit-code: '1'

          ignore-unfixed: true



      - name: Upload SARIF artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: trivy-${{ matrix.service }}-report

          path: trivy-${{ matrix.service }}.sarif

          retention-days: 30



      - name: Upload SARIF to Security tab

        if: always()

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: trivy-${{ matrix.service }}.sarif



      - name: Login to GHCR

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Push image (only if scan passed and on main)

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        uses: docker/build-push-action@v6

        with:

          context: ./${{ matrix.service }}

          file: ./${{ matrix.service }}/Containerfile

          target: production

          tags: |

            ghcr.io/${{ env.OWNER_LC }}/devops-project-app-${{ matrix.service }}:latest

            ghcr.io/${{ env.OWNER_LC }}/devops-project-app-${{ matrix.service }}:${{ github.sha }}

          push: true

