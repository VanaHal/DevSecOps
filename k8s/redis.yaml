apiVersion: apps/v1

kind: Deployment

metadata:

  name: redis

  labels:

    app: redis

spec:

  replicas: 1

  selector:

    matchLabels:

      app: redis

  template:

    metadata:

      labels:

        app: redis

    spec:

      serviceAccountName: redis-sa

      automountServiceAccountToken: false

      securityContext:

        runAsNonRoot: true

        seccompProfile:

          type: RuntimeDefault

      containers:

        - name: redis

          image: docker.io/library/redis:alpine

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:

              drop: ["ALL"]

          args: ["--save", "", "--appendonly", "no"]

          ports:

            - containerPort: 6379

          resources:

            requests:

              cpu: 50m

              memory: 64Mi

            limits:

              cpu: 200m

              memory: 256Mi

          readinessProbe:

            tcpSocket:

              port: 6379

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            tcpSocket:

              port: 6379

            initialDelaySeconds: 10

            periodSeconds: 20

---

apiVersion: v1

kind: Service

metadata:

  name: redis

  labels:

    app: redis

spec:

  selector:

    app: redis

  ports:

    - port: 6379

      targetPort: 6379

  type: ClusterIP
