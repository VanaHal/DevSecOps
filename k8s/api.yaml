apiVersion: v1

kind: ServiceAccount

metadata:

  name: api-sa

---

apiVersion: apps/v1

kind: Deployment

metadata:

  name: api

  labels:

    app: api

spec:

  replicas: 1

  selector:

    matchLabels:

      app: api

  template:

    metadata:

      labels:

        app: api

    spec:

      serviceAccountName: api-sa

      automountServiceAccountToken: false

      securityContext:

        runAsNonRoot: true

        seccompProfile:

          type: RuntimeDefault

      containers:

        - name: api

          image: image-registry.openshift-image-registry.svc:5000/devops-ticketing/api:latest

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:

              drop: ["ALL"]

          ports:

            - containerPort: 8080

          envFrom:

            - configMapRef:

                name: app-config

          env:

            - name: POSTGRES_USER

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_DB

          resources:

            requests:

              cpu: 100m

              memory: 128Mi

            limits:

              cpu: 500m

              memory: 512Mi

          readinessProbe:

            httpGet:

              path: /healthz

              port: 8080

            initialDelaySeconds: 10

            periodSeconds: 10

          livenessProbe:

            httpGet:

              path: /healthz

              port: 8080

            initialDelaySeconds: 20

            periodSeconds: 20

---

apiVersion: v1

kind: Service

metadata:

  name: api

  labels:

    app: api

spec:

  selector:

    app: api

  ports:

    - port: 8080

      targetPort: 8080

  type: ClusterIP
