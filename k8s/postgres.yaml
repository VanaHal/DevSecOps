apiVersion: v1

kind: PersistentVolumeClaim

metadata:

  name: postgres-pvc

spec:

  accessModes:

    - ReadWriteOnce

  resources:

    requests:

      storage: 1Gi

---

apiVersion: apps/v1

kind: Deployment

metadata:

  name: postgres

  labels:

    app: postgres

spec:

  replicas: 1

  strategy:

    type: Recreate

  selector:

    matchLabels:

      app: postgres

  template:

    metadata:

      labels:

        app: postgres

    spec:

      serviceAccountName: postgres-sa

      automountServiceAccountToken: false

      securityContext:

        runAsNonRoot: true

        seccompProfile:

          type: RuntimeDefault

      containers:

        - name: postgres

          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:12-el8

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:

              drop: ["ALL"]

          ports:

            - containerPort: 5432

          env:

            - name: POSTGRESQL_DATABASE

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_DB

            - name: POSTGRESQL_USER

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_USER

            - name: POSTGRESQL_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_PASSWORD

          volumeMounts:

            - name: postgres-storage

              mountPath: /var/lib/pgsql/data

          resources:

            requests:

              cpu: 100m

              memory: 128Mi

            limits:

              cpu: 500m

              memory: 512Mi

          readinessProbe:

            tcpSocket:

              port: 5432

            initialDelaySeconds: 10

            periodSeconds: 10

          livenessProbe:

            tcpSocket:

              port: 5432

            initialDelaySeconds: 20

            periodSeconds: 20

      volumes:

        - name: postgres-storage

          persistentVolumeClaim:

            claimName: postgres-pvc

---

apiVersion: v1

kind: Service

metadata:

  name: postgres

  labels:

    app: postgres

spec:

  selector:

    app: postgres

  ports:

    - port: 5432

      targetPort: 5432

  type: ClusterIP
