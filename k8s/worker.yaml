apiVersion: v1

kind: ServiceAccount

metadata:

  name: worker-sa

---

apiVersion: apps/v1

kind: Deployment

metadata:

  name: worker

  labels:

    app: worker

spec:

  replicas: 1

  selector:

    matchLabels:

      app: worker

  template:

    metadata:

      labels:

        app: worker

    spec:

      serviceAccountName: worker-sa

      automountServiceAccountToken: false

      securityContext:

        runAsNonRoot: true

        seccompProfile:

          type: RuntimeDefault

      containers:

        - name: worker

          image: image-registry.openshift-image-registry.svc:5000/devops-ticketing/worker:latest

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:

              drop: ["ALL"]

          envFrom:

            - configMapRef:

                name: app-config

          env:

            - name: POSTGRES_USER

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_DB

          resources:

            requests:

              cpu: 100m

              memory: 128Mi

            limits:

              cpu: 500m

              memory: 512Mi

          readinessProbe:

            exec:

              command: ["pgrep", "-f", "node"]

            initialDelaySeconds: 5

            periodSeconds: 15

          livenessProbe:

            exec:

              command: ["pgrep", "-f", "node"]

            initialDelaySeconds: 10

            periodSeconds: 20
